[package]
name = "woodshed-views"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Woodshed's Cambium view layer: view fns + CSS sheets for the Genet host (desktop and web). Genet-host plan S0+."

[dependencies]
woodshed-core = { workspace = true }
mere-surface-api = { workspace = true }
workbench = { workspace = true }
woodshedding = { workspace = true }
cambium = { workspace = true }
sprigging = { workspace = true }
tinct = { workspace = true }
# The persona gate. `mere-persona-picker` owns how a roster reads as a list
# (which persona is in use, how many keys the others hold); `personae` is
# needed to name the `Roster` the gate holds. Both are desktop-shaped — the
# vault is a filesystem — so a browser host would carry a stub rather than
# this pair. Nothing else in this crate touches them.
persona-picker = { workspace = true }
personae = { workspace = true }
# For the fretboard leaf's accessibility() hook — the same accesskit sprigging's
# Leaf trait speaks, so the neck can announce itself to assistive tech.
accesskit = "0.24"
serde = { workspace = true }
serde_json = { workspace = true }
