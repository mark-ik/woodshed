[package]
name = "woodshed-genet"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Woodshed's genet desktop host: winit window + netrender present over the woodshed-views view layer. Genet-host plan S0+."

[dependencies]
# The desktop realization of muniment's Backend. woodshed-core names the slots;
# this crate only decides which file each one lives in.
muniment = { git = "https://github.com/merely-made/mere.git", branch = "main" }
# The family-shared identity vault: which persona this machine practices as,
# and the key its practice session is sealed under. Desktop-only, which is why
# it is declared here rather than in the portable core.
personae = { git = "https://github.com/merely-made/mere.git", branch = "main" }
async-trait = "0.1"
woodshed-core = { workspace = true }
woodshed-audio = { workspace = true }
woodshed-views = { path = "../woodshed-views" }
cambium = { workspace = true }
cambium-winit = { workspace = true }
cambium-winit-a11y = { workspace = true }
sprigging = { workspace = true }
layout-dom-api = { workspace = true }
genet-scripted-dom = { workspace = true }
genet-layout = { workspace = true }
# The shared automatability substrate: selector resolution + the scenario
# driver, so woodshed's self-drive lane is the genet one, not a private copy.
genet-probe = { workspace = true }
genet-winit-host = { workspace = true }
netrender = { workspace = true }
paint_list_api = { workspace = true }
paint_list_render = { workspace = true }
wgpu = { workspace = true }
winit = { workspace = true }
directories = "5"
# Scenario captures encode a PNG from a texture readback.
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = { workspace = true }
