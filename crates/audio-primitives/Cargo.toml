[package]
name = "audio-primitives"
version = "0.1.0"
description = "Shared, framework-agnostic audio DSP primitives for the Merely family (Woodshed, Strophe, Mere): click synthesis, streaming onset detection + tempo estimation, and round-trip latency estimation. Pure std, no engine or UI dependency."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
keywords = ["audio", "dsp", "onset", "tempo", "latency"]
categories = ["multimedia::audio"]

# No dependencies by design — these are pure-std DSP/data primitives.
# Anything that needs cpal/Firewheel/UI is a *driver* and lives in the
# consuming crate (woodshed-audio's OnsetAnalyzer / CalibrationSession,
# strophe-engine's Firewheel graph), built on top of these cores.
[dependencies]
