[package]
name = "audio-primitives"
version = "0.1.0"
description = "Shared pure-std audio DSP primitives for the Merely family: waveform peaks, meter ballistics, click synthesis, onset/tempo detection, and latency estimation."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
keywords = ["audio", "dsp", "waveform", "meter", "tempo"]
categories = ["multimedia::audio"]

# No dependencies by design — these are pure-std DSP/data primitives.
# Anything that needs cpal/Firewheel/UI is a *driver* and lives in the
# consuming crate (woodshed-audio's OnsetAnalyzer / CalibrationSession,
# strophe-engine's Firewheel graph), built on top of these cores.
[dependencies]
