[package]
name = "woodshed-instrument"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Connection and device state for a Bluetooth-controlled smart instrument, joining Woodshed's practice concepts to the instrument's own."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# Git dependencies in the same form as the genet crates, now that ringdown is
# pushed. ringdown is also on crates.io, but ringdown-ble is publish = false,
# so both come from the repo to keep the two halves in step.
ringdown = { git = "https://github.com/merely-made/ringdown.git", branch = "main" }
ringdown-ble = { git = "https://github.com/merely-made/ringdown.git", branch = "main" }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "time", "macros"] }
