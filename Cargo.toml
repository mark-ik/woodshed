[workspace]
resolver = "2"
members = [
    "crates/woodshedding",
    "crates/woodshed-audio",
    "crates/audio-primitives",
    "crates/woodshed-core",
    "crates/woodshed-views",
    "crates/woodshed-serval",
    # The chartulary substrate's first real consumer (G3): woodshed's theory
    # catalog as a content graph. Folded in from its own repo 2026-07-08.
    "crates/woodshed-graph",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Mark <sgt.mark3@gmail.com>"]
repository = "https://github.com/mark-ik/woodshed"
rust-version = "1.80"

[workspace.dependencies]
# Internal crates
woodshedding = { path = "crates/woodshedding", version = "0.1.0" }
# Portable state/logic core for the serval-host stack (W1.1 split).
woodshed-core = { path = "crates/woodshed-core", version = "0.1.0" }
woodshed-audio = { path = "crates/woodshed-audio", version = "0.1.0" }
woodshed-graph = { path = "crates/woodshed-graph", version = "0.1.0" }
# Shared pure-DSP primitives (click synth, onset/tempo, latency) — the
# `audio-primitives` extraction. Pure std; consumed by woodshed-audio
# here and cross-repo by strophe-engine via path-dep.
audio-primitives = { path = "crates/audio-primitives", version = "0.1.0" }
# (pitch-detection is declared further down under "Audio".)

# The mark-ik/xilem Masonry fork is fully retired (2026-07-08): its last
# consumers — the shared xilem-components + audio-widgets crates, used by
# Strophe's Masonry app — are gone now Strophe runs on xilem_serval with
# chisel leaves. woodshed itself has been serval-only since the S5 cut.
winit = "0.30"

# UI — serval host (2026-07-04 serval-host plan). The woodshed app now
# rides this stack exclusively. GIT deps on the owned repos so any machine
# resolves;
# local checkouts are picked up via the gitignored .cargo/config.toml
# source-specific [patch] overrides (the mere pattern). serval's internal
# path deps (layout-dom-api, xilem-core, ...) resolve inside its git
# checkout; only the crates woodshed names appear here.
xilem-serval = { git = "https://github.com/mark-ik/serval.git", branch = "main" }
layout-dom-api = { git = "https://github.com/mark-ik/serval.git", branch = "main" }
serval-scripted-dom = { git = "https://github.com/mark-ik/serval.git", branch = "main" }
serval-layout = { git = "https://github.com/mark-ik/serval.git", branch = "main" }
serval-winit-host = { git = "https://github.com/mark-ik/serval.git", branch = "main" }
netrender = { git = "https://github.com/mark-ik/netrender.git", branch = "main" }
netrender_device = { git = "https://github.com/mark-ik/netrender.git", branch = "main" }
paint_list_api = { git = "https://github.com/mark-ik/netrender.git", branch = "main" }
paint_list_render = { git = "https://github.com/mark-ik/netrender.git", branch = "main" }
# wgpu for host-side surface/compose types only; backend features come from
# netrender's own per-target manifest split. The serval stack is wgpu 29;
# the shared Masonry crates' wgpu 28 tree coexists until the Strophe refactor.
wgpu = { version = "29", default-features = false, features = ["std"] }

# Theming: pure OKLCH seed-to-palette derivation (Merely-family shared
# crate; repo dir is `tincture`, package is `tinct`). Replaces reaching
# into audio-widgets' masonry-coupled theme module.
tinct = { git = "https://github.com/mark-ik/tinct", branch = "main" }

# Audio
cpal = "0.18"
pitch-detector = { version = "0.3", features = ["hinted"] }
# `pitch-detection` (separate crate from `pitch-detector` above)
# ships the time-domain detectors — Autocorrelation, McLeod (NSDF),
# YIN — that pitch-detector left commented-out. We use the
# `McLeodDetector` for octave-confusion-resistant tuning on guitar
# low strings. Conversion from raw frequency to note/cents is done
# locally; this crate just supplies the frequency estimate.
pitch-detection = "0.3"
hound = "3.5"
midir = "0.11"

# Persistence
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Future:
#   fundsp          — DSP for fancier sounds (deferred — raw sin is enough for click)
#   symphonia       — FLAC / OGG / MP3 sample loading (deferred — WAV via hound is enough for now)

# PDB symbol-length limit on Windows MSVC is handled by the
# /DEBUG:LongSymbolTruncate linker flag set in .cargo/config.toml.
# Xilem's deeply-nested generic view types would otherwise overflow
# the per-symbol PDB budget (LNK4319) on dev builds; the truncate
# mode keeps debug info usable while bumping the limit.

# Mirror of serval's [patch.crates-io] entries this workspace's serval
# graph needs — patches are per-workspace-root and do NOT inherit through
# a git dep (the mere root carries the same mirror). No local paths here:
# taffy + ipc-channel are vendored inside the serval repo and reached
# through its git, by branch (owned forks track branches, never revs).
[patch.crates-io]
# stylo_taffy names crates.io stylo/stylo_atoms ^0.18; serval now pins the
# same crates from the mark-ik/stylo fork (`mark-ik/servo-media-features`
# branch, Servo-mode capabilities), and stylo declares
# links = "servo_style_crate" (one Stylo per graph), so mirror serval's
# patch to the same fork branch to unify. (Was servo/stylo@8bde0e96 until
# serval moved to the fork.)
stylo = { git = "https://github.com/mark-ik/stylo", branch = "mark-ik/servo-media-features" }
stylo_atoms = { git = "https://github.com/mark-ik/stylo", branch = "mark-ik/servo-media-features" }
# serval-layout requires taffy =0.11.0-experimental-cache-fix.3 (serval's
# vendored float-layout fork, not on crates.io).
taffy = { git = "https://github.com/mark-ik/serval.git", branch = "main" }
# ipc-channel: serval's in-process fork (force-inprocess default; drops
# the windows 0.61 pin that broke gpu-allocator/wgpu-hal unification).
ipc-channel = { git = "https://github.com/mark-ik/serval.git", branch = "main" }
