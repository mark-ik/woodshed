[workspace]
resolver = "2"
members = [
    "crates/woodshedding",
    "crates/woodshed-audio",
    "crates/audio-primitives",
    "crates/xilem-components",
    "crates/audio-widgets",
    "crates/woodshed-xilem",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Mark <sgt.mark3@gmail.com>"]
repository = "https://github.com/mark-ik/woodshed"
rust-version = "1.80"

[workspace.dependencies]
# Internal crates
woodshedding = { path = "crates/woodshedding", version = "0.1.0" }
woodshed-audio = { path = "crates/woodshed-audio", version = "0.1.0" }
# Shared audio widgets (waveform, …) — also consumed cross-repo by
# Strophe via path-dep; the first `audio-widgets` extraction.
audio-widgets = { path = "crates/audio-widgets", version = "0.1.0" }
# Shared pure-DSP primitives (click synth, onset/tempo, latency) — the
# `audio-primitives` extraction. Pure std; consumed by woodshed-audio
# here and cross-repo by strophe-engine via path-dep.
audio-primitives = { path = "crates/audio-primitives", version = "0.1.0" }
# Domain-neutral reusable UI components (combobox, …) — the generic
# design-system layer shared by all three Xilem apps (Woodshed,
# Strophe, Mere). audio-widgets sits one layer above this.
xilem-components = { path = "crates/xilem-components", version = "0.1.0" }
# (pitch-detection is declared further down under "Audio".)

# UI — Xilem (decision locked 2026-05-18; iced retired).
# Woodshed rides its own lean fork branch: `woodshed-theme` on
# github.com/mark-ik/xilem = `upstream/main` + the single PR #1822 commit
# `WindowView::with_default_properties` (no-restart retheme). Masonry's
# `set_default_properties` (PR #1821) is already upstream, so no masonry patch
# is carried; this also rides upstream's wgpu-28/vello-0.8 rather than the
# mere/serval `mere-wgpu-29-vello-0-9` fork.
#
# GIT deps (not path) so woodshed-xilem builds on any machine (Win/macOS/Linux)
# without the local `crates/xilem-woodshed` worktree. Cargo.lock pins the exact
# commit, so builds stay reproducible; `cargo update -p xilem` re-locks to the
# branch tip. To iterate on the fork locally, override these with the worktree
# via a machine-local `paths = [...]` in a parent `.cargo/config.toml` (e.g.
# `crates/../.cargo/config.toml`) — don't edit this file for that. Switch to
# crates.io once #1822 lands and a masonry release ships. Keep default features
# (incl. `imaging_vello`); disabling them panics the Masonry imaging layer with
# "a renderer backend feature is required" at first paint.
xilem = { git = "https://github.com/mark-ik/xilem.git", branch = "woodshed-theme", version = "0.4.0" }
masonry = { git = "https://github.com/mark-ik/xilem.git", branch = "woodshed-theme", version = "0.4.0" }
masonry_winit = { git = "https://github.com/mark-ik/xilem.git", branch = "woodshed-theme", version = "0.4.0" }
winit = "0.30"

# Audio
cpal = "0.15"
pitch-detector = { version = "0.3", features = ["hinted"] }
# `pitch-detection` (separate crate from `pitch-detector` above)
# ships the time-domain detectors — Autocorrelation, McLeod (NSDF),
# YIN — that pitch-detector left commented-out. We use the
# `McLeodDetector` for octave-confusion-resistant tuning on guitar
# low strings. Conversion from raw frequency to note/cents is done
# locally; this crate just supplies the frequency estimate.
pitch-detection = "0.3"
hound = "3.5"
midir = "0.11"

# Persistence
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Future:
#   fundsp          — DSP for fancier sounds (deferred — raw sin is enough for click)
#   symphonia       — FLAC / OGG / MP3 sample loading (deferred — WAV via hound is enough for now)

# PDB symbol-length limit on Windows MSVC is handled by the
# /DEBUG:LongSymbolTruncate linker flag set in .cargo/config.toml.
# Xilem's deeply-nested generic view types would otherwise overflow
# the per-symbol PDB budget (LNK4319) on dev builds; the truncate
# mode keeps debug info usable while bumping the limit.
