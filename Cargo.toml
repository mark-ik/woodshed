[workspace]
resolver = "2"
members = [
    "crates/music-theory",
    "crates/audio",
    "crates/app",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Mark <sgt.mark3@gmail.com>"]
repository = "https://github.com/TBD/guitar-toolkit"
rust-version = "1.80"

[workspace.dependencies]
# Internal crates
music-theory = { path = "crates/music-theory" }
audio = { path = "crates/audio" }

# UI
iced = { version = "0.13", features = ["canvas", "tokio"] }

# Audio
cpal = "0.15"
pitch-detector = { version = "0.3", features = ["hinted"] }

# Future:
#   fundsp          — DSP for fancier sounds (deferred — raw sin is enough for click)
#   serde           — tuning / preset persistence
