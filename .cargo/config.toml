# tinct is a genet component too (2026-07-23), so its redirect belongs in THIS
# table. It sat under [patch."https://github.com/mark-ik/tinct"] until
# 2026-07-24, which matched nothing: the local checkout was quietly unused and
# the build took genet.git's remote copy. Same silent-bypass shape as the
