# Local dev overrides, intentionally uncommitted (machine paths).
#
# NO override for the mark-ik/xilem fork: woodshed-xilem rides its git dep.
# The old global `paths = [".../xilem-woodshed"]` override matched by package
# NAME across the whole graph, so the fork's `xilem_core` hijacked genet's
# vendored `xilem_core` (surfaced 2026-07-05 when genet's copy grew
# ElementSplice::hoist_pending); and a source-keyed [patch] can't work either,
# because two PATH-sourced `xilem_core v0.4.0` collide in the lockfile. If
# fork iteration resumes, prefer pushing to the fork branch and re-locking.

# Xilem's deeply-nested generic view types blow the Windows PDB
# symbol limit on dev builds (LNK4319). The linker has a "truncate
# long symbol names rather than fail" mode that solves this without
# stripping debug info. The other approach is `debug = 0` on the
# crate, which loses too much info.
#
# Only applied on Windows MSVC; no-op on Linux/macOS toolchains.
[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "link-arg=/DEBUG:LongSymbolTruncate"]

# Local genet/netrender checkouts (the mere pattern: source-specific
# [patch] entries, not `paths`, so dependency-list changes in the sibling
# checkouts don't trigger the path-override warning storm). Lists component
# dirs plus the direct crates.io override required for the vendored
# stylo_taffy adapter. Cargo does not chain a second patch through the
# committed crates.io -> Genet Git redirect.
[patch.crates-io]
layout-dom-api = { path = "C:/Users/mark_/Code/repos/genet/components/shared/layout-dom" }
genet-scripted-dom = { path = "C:/Users/mark_/Code/repos/genet/components/genet-scripted-dom" }

[patch."https://github.com/mark-ik/genet.git"]
"layout-dom-api" = { path = "C:/Users/mark_/Code/repos/genet/components/shared/layout-dom" }
"genet-layout" = { path = "C:/Users/mark_/Code/repos/genet/components/genet-layout" }
"genet-scripted-dom" = { path = "C:/Users/mark_/Code/repos/genet/components/genet-scripted-dom" }
"genet-winit-host" = { path = "C:/Users/mark_/Code/repos/genet/components/genet-winit-host" }
"genet-probe" = { path = "C:/Users/mark_/Code/repos/genet/components/genet-probe" }
# ─── Adopted into genet 2026-07-23 (repo consolidation) ───────────────────
netfetcher = { path = "C:/Users/mark_/Code/repos/genet/components/netfetcher" }
cambium = { path = "C:/Users/mark_/Code/repos/genet/components/cambium/cambium" }
"cambium-winit" = { path = "C:/Users/mark_/Code/repos/genet/components/cambium/cambium-winit" }
"cambium-winit-a11y" = { path = "C:/Users/mark_/Code/repos/genet/components/cambium/cambium-winit-a11y" }
